[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proofvault-backend"
version = "0.1.0"
description = "Backend API for a personal mathematical knowledge library"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "PyJWT[crypto]>=2.10,<3.0",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<4.0",
    "sqlalchemy>=2.0.40,<2.1",
    "pgvector>=0.4,<0.5",
    "alembic>=1.13,<2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
